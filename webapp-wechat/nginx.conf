events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
      try_files $uri =404;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
